# Copy to application.yml and supply credentials through environment variables.
server:
  port: 8087

spring:
  application:
    name: consultant
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/diet?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 3s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API_KEY}
      model-name: qwen-plus
      temperature: 0.7
      log-requests: false
      log-responses: false
      timeout: 60s
    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API_KEY}
      model-name: qwen-plus
      temperature: 0.7
      log-requests: false
      log-responses: false
      timeout: 60s
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${API_KEY}
      model-name: text-embedding-v3
      dimensions: 1024
      max-segments-per-batch: 10
      log-requests: false
      log-responses: false
      timeout: 60s

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  llm:
    preprocess-enabled: false
    preprocess-model-name: qwen-plus
    context-window-max-chars: 12000
    context-window-recent-reserve: 4
    chat-memory-ttl-days: 1
  vision:
    model-name: qwen-vl-plus
    max-image-bytes: 8388608
  vector-store:
    pgvector:
      host: localhost
      port: 5432
      user: ${PGVECTOR_USER:postgres}
      password: ${PGVECTOR_PASSWORD}
      database: consultant_vec
      table: consultant_embedding
      dimension: 1024
      create-table: true
      drop-table-first: false
      use-index: true
      index-list-size: 100
      skip-create-vector-extension: false
      auto-ingest: true
  rag:
    parallel:
      graph-timeout-ms: 1200
    search:
      enabled: false
      base-url: http://localhost:9200
      index-name: consultant_knowledge
      auto-index: true
      request-timeout-ms: 1500
    rerank:
      enabled: true
      base-url: https://dashscope.aliyuncs.com
      api-key: ${API_KEY}
      model-name: qwen3-rerank
      candidate-limit: 32
      top-n: 4
      max-document-chars: 3500
      request-timeout-ms: 3000
  knowledge-graph:
    neo4j:
      enabled: false
  guardrails:
    input:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never



  health:
    neo4j:
      enabled: false
